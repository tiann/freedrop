<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freedrop</title>
<style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: light-dark(#fafafa, #111); color: light-dark(#222, #ddd);
    }
    h1 { font-size: 1.4rem; margin: 0; letter-spacing: .02em; }
    h1 span { opacity: .45; font-weight: 400; }
    #card {
        width: min(30rem, 100%); border-radius: 14px; padding: 1.5rem;
        background: light-dark(#fff, #1c1c1e);
        box-shadow: 0 2px 16px rgba(0,0,0,.08);
        display: flex; flex-direction: column; gap: .9rem;
    }
    #drop {
        border: 2px dashed light-dark(#bbb, #444); border-radius: 10px;
        padding: 2.2rem 1rem; text-align: center; cursor: pointer;
        transition: border-color .15s, background .15s;
    }
    #drop.hover { border-color: #4a90d9; background: rgba(74,144,217,.06); }
    .file { display: flex; justify-content: space-between; gap: 1rem; font-size: .95rem; }
    .file .size { opacity: .55; white-space: nowrap; }
    .file a { color: #4a90d9; text-decoration: underline dotted; }
    #link {
        font: .8rem/1.4 ui-monospace, monospace; word-break: break-all;
        padding: .6rem .7rem; border-radius: 8px;
        background: light-dark(#f0f0f0, #2a2a2c); user-select: all;
    }
    button {
        font: inherit; border: 0; border-radius: 8px; padding: .55rem 1.1rem;
        background: #4a90d9; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: transparent; color: #4a90d9; }
    #bar { height: 6px; border-radius: 3px; background: light-dark(#eee, #333); overflow: hidden; display: none; }
    #bar div { height: 100%; width: 0; background: #4a90d9; transition: width .15s; }
    #status { font-size: .9rem; opacity: .75; min-height: 1.4em; }
    #status.error { color: #d94a4a; opacity: 1; }
    footer { font-size: .8rem; opacity: .5; }
    footer a { color: inherit; }
    .row { display: flex; gap: .6rem; align-items: center; }
</style>
</head>
<body>
<h1>freedrop <span>· direct file transfer</span></h1>
<div id="card">
    <div id="drop" hidden>⇪<br><span id="drop-label">Drop files here, or tap to choose</span></div>
    <input id="picker" type="file" multiple hidden>
    <div id="files"></div>
    <div id="link" hidden></div>
    <div class="row" id="actions" hidden></div>
    <div id="bar"><div></div></div>
    <div id="status"></div>
</div>
<footer><a href="https://github.com/tiann/freedrop">github.com/tiann/freedrop</a> — bytes go peer-to-peer, never through a server</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
