<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<title>freedrop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6bed'/%3E%3Cpath d='M16 8v13m-5.5-5.5L16 21l5.5-5.5M10 24h12' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
    :root {
        --bg: #f5f6f8; --card: #fff; --text: #17181a; --muted: #6b6f76; --faint: #9a9ea6;
        --line: #e6e8ec; --line-strong: #cdd1d8; --soft: #f1f2f5; --accent: #2f6bed; --accent-hover: #2459d0;
        --accent-soft: rgba(47, 107, 237, .08); --ok: #1a9a55; --ok-soft: rgba(26, 154, 85, .12);
        --err: #d63b3b; --err-soft: rgba(214, 59, 59, .1);
        --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -8px rgba(16, 24, 40, .1);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0e0f11; --card: #18191c; --text: #ececef; --muted: #9b9fa7; --faint: #6c7078;
            --line: #2a2c31; --line-strong: #3d4048; --soft: #222428; --accent: #5b8cff; --accent-hover: #7aa2ff;
            --accent-soft: rgba(91, 140, 255, .12); --ok: #3fbf78; --ok-soft: rgba(63, 191, 120, .14);
            --err: #ff6b6b; --err-soft: rgba(255, 107, 107, .12);
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -8px rgba(0, 0, 0, .5);
        }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
        margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem; padding: 2rem 1rem;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    }
    header { text-align: center; }
    .brand {
        display: inline-flex; align-items: center; gap: .55rem; color: inherit; text-decoration: none;
        font-size: 1.35rem; font-weight: 650; letter-spacing: -.01em;
    }
    .brand svg { width: 30px; height: 30px; }
    #tagline { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }
    #card {
        width: min(28rem, 100%); border-radius: 18px; padding: 1.25rem;
        background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line);
        display: flex; flex-direction: column; gap: 1rem;
    }
    button {
        font: inherit; font-weight: 550; border: 0; border-radius: 10px; padding: .6rem 1rem;
        background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
        display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
        transition: background .15s, color .15s, opacity .15s;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible, #drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.ghost { background: var(--soft); color: var(--text); }
    button.ghost:hover { background: var(--line); }
    button.icon { padding: .45rem; background: transparent; color: var(--muted); }
    button.icon:hover { background: var(--soft); color: var(--text); }
    button svg { width: 16px; height: 16px; flex: none; }

    #drop {
        display: flex; flex-direction: column; align-items: center; gap: .35rem; width: 100%;
        padding: 2.75rem 1rem 2.5rem; border-radius: 14px; font-weight: 400;
        border: 1.5px dashed var(--line-strong); background: var(--soft); color: var(--text);
        transition: border-color .15s, background .15s;
    }
    #drop:hover { border-color: var(--accent); background: var(--accent-soft); }
    #drop.hover { border: 1.5px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
    #drop .glyph {
        width: 48px; height: 48px; border-radius: 14px; margin-bottom: .5rem;
        display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
        transition: transform .15s;
    }
    #drop.hover .glyph { transform: translateY(-3px); }
    #drop .glyph svg { width: 24px; height: 24px; }
    #drop strong { font-size: 1.05rem; font-weight: 600; }
    #drop-hint { color: var(--muted); font-size: .9rem; }
    #scan { width: 100%; padding: .7rem 1rem; margin-top: -.25rem; }
    #viewfinder { position: relative; overflow: hidden; aspect-ratio: 1; border-radius: 14px; background: #000; }
    #viewfinder video { display: block; width: 100%; height: 100%; object-fit: cover; }
    #viewfinder video.mirror { transform: scaleX(-1); }
    #viewfinder::after {
        content: ""; position: absolute; inset: 15%; border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35);
    }
    #viewfinder:not([hidden]) ~ #hint { text-align: center; }

    #summary { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: -.4rem; }
    #files { list-style: none; margin: 0; padding: 0; max-height: 15.5rem; overflow-y: auto; }
    .file { display: flex; align-items: center; gap: .75rem; padding: .45rem 0; min-width: 0; }
    .file + .file { border-top: 1px solid var(--line); }
    .file .tile {
        flex: none; width: 2.25rem; height: 2.25rem; border-radius: 9px; display: grid; place-items: center;
        background: var(--soft); color: var(--muted); font: 600 .6rem/1 var(--mono); letter-spacing: .02em;
        transition: background .2s, color .2s;
    }
    .file .tile svg { width: 18px; height: 18px; }
    .file.done .tile { background: var(--ok-soft); color: var(--ok); font-size: 1rem; }
    .file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file .size { flex: none; color: var(--faint); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .file a { color: var(--accent); text-decoration: none; }
    .file a:hover { text-decoration: underline; }

    #link { display: flex; flex-direction: column; gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    #link .label { font-size: .8rem; color: var(--muted); }
    .share { display: flex; align-items: center; gap: 1rem; }
    .links { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .5rem; }
    .qr { flex: none; width: 135px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .qr svg { display: block; width: 100%; height: auto; }
    .field {
        display: flex; align-items: center; gap: .4rem; min-width: 0;
        padding: .3rem .3rem .3rem .75rem; border-radius: 11px; background: var(--soft);
    }
    .field .val {
        flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font: .82rem/1.4 var(--mono); user-select: all;
    }
    .field button { padding: .4rem .75rem; border-radius: 8px; font-size: .85rem; }
    .field button.icon { padding: .45rem; }
    .field.cmd .val::before { content: "$ "; color: var(--faint); user-select: none; }
    #link .label.cli { margin-top: .25rem; margin-bottom: -.15rem; }

    #progress { display: flex; flex-direction: column; gap: .5rem; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-width: 0; }
    #status { display: flex; align-items: center; gap: .55rem; min-width: 0; font-weight: 500; }
    #status:empty { display: none; }
    #status i {
        flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%; display: grid; place-items: center;
        font: normal 700 .72rem/1 system-ui, sans-serif;
    }
    #status.busy i { border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    #status.done i { background: var(--ok); color: #fff; }
    #status.error { color: var(--err); font-weight: 450; align-items: flex-start; }
    #status.error i { background: var(--err); color: #fff; margin-top: .1rem; }
    #pct { font-weight: 600; font-variant-numeric: tabular-nums; }
    #bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
    #bar div { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .2s, background .3s; }
    #card.done #bar div { background: var(--ok); }
    #meta { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    #hint { margin: -.5rem 0 0; font-size: .82rem; color: var(--muted); }
    #hint.error { margin-top: 0; text-align: center; color: var(--err); }
    #actions { display: flex; gap: .5rem; }
    #actions button { flex: 1; padding: .7rem 1rem; }

    #trust { display: flex; align-items: center; justify-content: center; gap: .4rem; font-size: .8rem; color: var(--faint); }
    #trust svg { width: 13px; height: 13px; }
    footer { font-size: .8rem; color: var(--faint); }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--muted); text-decoration: underline; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 2.4s !important; } }
    @media (max-width: 480px) {
        body { justify-content: flex-start; padding-top: 2.5rem; gap: 1.25rem; }
        #card { padding: 1rem; border-radius: 16px; }
        #drop { padding: 2.25rem 1rem 2rem; }
        .share { flex-direction: column-reverse; align-items: stretch; }
        .qr { align-self: center; width: 180px; margin-top: .25rem; }
    }
</style>
</head>
<body>
<header>
    <a class="brand" href="./">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2f6bed"/><path d="M16 8v13m-5.5-5.5L16 21l5.5-5.5M10 24h12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        freedrop
    </a>
    <p id="tagline"></p>
</header>
<main id="card">
    <button id="drop" type="button" hidden>
        <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m-4.5 4.5L12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
        <strong id="drop-title"></strong>
        <span id="drop-hint"></span>
    </button>
    <button id="scan" class="ghost" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2m8 0h2a2 2 0 0 1 2 2v2m0 8v2a2 2 0 0 1-2 2h-2m-8 0H6a2 2 0 0 1-2-2v-2M4 12h16"/></svg>
        <span id="scan-label"></span>
    </button>
    <div id="viewfinder" hidden><video muted playsinline></video></div>
    <input id="picker" type="file" multiple hidden>
    <div id="summary" hidden><span id="count"></span></div>
    <ul id="files" hidden></ul>
    <div id="link" hidden></div>
    <div id="progress" hidden>
        <div class="row"><div id="status"></div><span id="pct"></span></div>
        <div id="bar" hidden><div></div></div>
        <div id="meta" class="row" hidden><span id="amount"></span><span id="rate"></span></div>
    </div>
    <p id="hint" hidden></p>
    <div id="actions" hidden></div>
    <div id="trust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="trust-text"></span></div>
</main>
<footer><a href="https://github.com/tiann/freedrop">github.com/tiann/freedrop</a></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
